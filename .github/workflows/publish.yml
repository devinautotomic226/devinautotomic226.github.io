name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A28416: ${{ secrets.A28416 }}
          BABB3F: ${{ secrets.BABB3F }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A28416', '')
          sec_b = os.environ.get('BABB3F', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- d304f89aab0e99de3e5ad5ca3f -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 0c1292c116d2516d1e77b7b7e008cd9c09106fccdab98b -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
